# Procedimiento único para levantar todo el sistema:
#
#   Copy-Item .env.example .env     (PowerShell)  ·  cp .env.example .env  (bash)
#   docker compose up -d --build
#
# Al host salen el gateway (la única entrada al sistema, que además sirve el
# frontend en http://localhost:8080) y las consolas de operación: la UI de
# Jaeger, la de RabbitMQ, Prometheus, Grafana y el control del mock de FAV, que
# hace de proveedor externo. En la nube, docker-compose.nube.yml deja solo el
# gateway hacia afuera (ver docs/NUBE.md). Las bases, el broker y los servicios quedan en la
# red interna. Las migraciones y el seed los aplica cada servicio al arrancar;
# Postgres solo corre al crear el volumen el script que arma una base por
# servicio (infra/postgres/init/).

name: arq-soft-proveedores

# Las dos réplicas tienen que ser idénticas para que el balanceo signifique
# algo, así que comparten esta definición. Son dos servicios con nombre y no
# `deploy.replicas` porque el gateway necesita dos nombres DNS distintos: un
# http.Client de Go se queda con la primera dirección que resuelve y repartiría
# todo a la misma réplica.
x-proveedores: &proveedores
  image: arq-soft/proveedores-service:dev
  environment:
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    API_KEYS: ${API_KEYS:?falta API_KEYS en .env}
    PORT: "8080"
    # Con esto el servicio exporta sus spans y la traza del gateway sigue hasta
    # la consulta a Postgres. Si se saca, el servicio arranca igual: las trazas
    # quedan en no-op.
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Consume ListaPreciosActualizada (ADR-005). Las dos réplicas se suscriben y
    # la cola le entrega a una sola; si esa cae, toma la otra.
    RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
    # Caché de la capacidad (ADR-007). En false, la capacidad lee directo de
    # PostgreSQL: es lo que deja medir con y sin caché.
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CACHE_HABILITADA: ${CACHE_HABILITADA:-true}
    # Búsqueda (ADR-006). El índice se reconstruye solo si no existe.
    MEILI_URL: http://meilisearch:7700
    MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
  depends_on:
    postgres:
      condition: service_healthy
    # Estas tres no son dependencias duras: si no están, el servicio atiende la
    # capacidad igual y se conecta cuando vuelven. service_started solo ordena el
    # arranque.
    rabbitmq:
      condition: service_started
    redis:
      condition: service_started
    meilisearch:
      condition: service_started
  # La imagen del servicio es distroless: no trae shell ni cliente HTTP, así que
  # el healthcheck es el binario `sonda` de su propia imagen, que pregunta por
  # /readyz y sale 0 o 1.
  healthcheck:
    test: ["CMD", "/sonda"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 40s
  networks: [interna]
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?falta POSTGRES_DB en .env}
      # La base de stock-service, con su propio usuario (ADR-003). La crea el
      # script de init solo cuando el volumen está vacío.
      STOCK_DB: ${STOCK_DB:?falta STOCK_DB en .env}
      STOCK_DB_USER: ${STOCK_DB_USER:?falta STOCK_DB_USER en .env}
      STOCK_DB_PASSWORD: ${STOCK_DB_PASSWORD:?falta STOCK_DB_PASSWORD en .env}
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # El $$ escapa el $ para que lo expanda la shell del contenedor y no compose.
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [interna]
    restart: unless-stopped

  # Colector y visor de trazas en un solo contenedor. La línea 1.x acepta OTLP
  # en 4317/4318 sin archivo de configuración.
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    ports:
      - "${PUERTO_JAEGER:-16686}:16686" # UI
    healthcheck:
      # 14269 es el puerto de administración de Jaeger; no se publica al host.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:14269/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    networks: [interna]
    restart: unless-stopped

  # Broker de los eventos de dominio (ADR-005). La UI de administración se
  # publica para ver las colas y la de mensajes fallidos durante la demo.
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?falta RABBITMQ_USER en .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?falta RABBITMQ_PASSWORD en .env}
    ports:
      - "${PUERTO_RABBITMQ_UI:-15672}:15672"
    volumes:
      - datos-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [interna]
    restart: unless-stopped

  # Base documental de import-service (ADR-003): guarda cada importación con
  # la respuesta cruda del proveedor, que cambia de forma según quién la manda.
  mongodb:
    # 9.0 y no 8.0: el TCMalloc de 8.0 rompe el ABI de rseq y MongoDB no
    # arranca sobre kernels 6.19 o más nuevos (SERVER-121912). Tiene que ser
    # la misma imagen que el test de integración del adaptador.
    image: mongo:9.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?falta MONGO_USER en .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?falta MONGO_PASSWORD en .env}
    volumes:
      - datos-mongodb:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [interna]
    restart: unless-stopped

  # Caché de lecturas de proveedores-service (ADR-007). Sin persistencia a
  # propósito: si se reinicia, se vuelve a llenar desde PostgreSQL.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?falta REDIS_PASSWORD en .env}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [interna]
    restart: unless-stopped

  # Motor de búsqueda (ADR-006). El índice se puede reconstruir desde
  # PostgreSQL, así que el volumen solo evita reindexar en cada arranque.
  meilisearch:
    image: getmeili/meilisearch:v1.14
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?falta MEILI_MASTER_KEY en .env}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - datos-meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [interna]
    restart: unless-stopped

  # Mock del catálogo de FAV (el grupo de ropa), que cumple su contrato v1.1.0.
  # Se usa mientras FAV no tenga URL desplegada: con FAV_URL en .env,
  # import-service apunta al real y este queda sin uso. Su puerto se publica
  # para simular fallas en el Game Day:
  #   curl -X POST localhost:8090/_mock/modo -d '{"modo":"caido"}'
  fav-mock:
    image: arq-soft/import-service:dev
    pull_policy: never
    entrypoint: ["/fav-mock"]
    environment:
      PORT: "8090"
      FAV_MOCK_CLAVE: ${FAV_API_KEY:?falta FAV_API_KEY en .env}
      # Firma los avisos de pedidos con el mismo secreto que verifica
      # stock-service.
      FAV_MOCK_SECRETO_AVISOS: ${FAV_SECRETO_AVISOS:-secreto-de-prueba}
    ports:
      - "${PUERTO_FAV_MOCK:-8090}:8090"
    healthcheck:
      test: ["CMD", "/sonda"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks: [interna]
    restart: unless-stopped

  # Importa el catálogo de FAV cada 5 minutos, lo guarda en MongoDB y publica
  # ListaPreciosActualizada (ADR-009). No pasa por el gateway: es el servicio
  # el que llama a FAV (consigna 4.1).
  import-service:
    build:
      # El contexto es la raíz del repo: el módulo depende de
      # pkg/observabilidad y pkg/mensajeria por ruta relativa.
      context: .
      dockerfile: services/import-service/Dockerfile
    image: arq-soft/import-service:dev
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      MONGO_DB: importaciones
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      FAV_URL: ${FAV_URL:-http://fav-mock:8090}
      FAV_API_KEY: ${FAV_API_KEY}
      FAV_PROVEEDOR_ID: "11"
      FAV_FLETE: ${FAV_FLETE:-0}
      INTERVALO_SINCRONIZACION: ${INTERVALO_SINCRONIZACION:-5m}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      mongodb:
        condition: service_healthy
      # RabbitMQ y FAV no son dependencias duras: si no están, los eventos
      # esperan en el outbox y siguen valiendo las últimas ofertas.
      rabbitmq:
        condition: service_started
      fav-mock:
        condition: service_started
    healthcheck:
      test: ["CMD", "/sonda"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [interna]
    restart: unless-stopped

  proveedores-service-1:
    <<: *proveedores
    # Solo esta réplica declara el build. Las dos corren exactamente la misma
    # imagen y, si las dos la construyeran, chocarían al etiquetarla: compose
    # las construye en paralelo.
    build:
      # El contexto es la raíz del repo: el módulo del servicio depende de
      # pkg/observabilidad por ruta relativa, igual que el del gateway.
      context: .
      dockerfile: services/proveedores-service/Dockerfile

  proveedores-service-2:
    <<: *proveedores
    # Reusa la imagen que construyó la réplica 1; es local, no hay registro del
    # que bajarla.
    pull_policy: never

  # Administra el stock propio: reserva unidades sin sobreventa (HU-13,
  # ADR-004), repone lo que baja del mínimo (HU-14) y le hace los pedidos a
  # FAV, que le avisa por webhook en /webhooks/fav (ADR-009). Usa su propia base
  # `stock` con su propio usuario, que no puede conectarse a la de proveedores
  # (ADR-003). No publica puerto al host: desde afuera se lo alcanza por el
  # gateway en /api/v1/stock/ (el webhook queda fuera del gateway, ADR-009).
  stock-service:
    build:
      # El contexto es la raíz del repo: el módulo del servicio depende de
      # pkg/observabilidad por ruta relativa, igual que los otros.
      context: .
      dockerfile: services/stock-service/Dockerfile
    image: arq-soft/stock-service:dev
    environment:
      DATABASE_URL: postgres://${STOCK_DB_USER}:${STOCK_DB_PASSWORD}@postgres:5432/${STOCK_DB}?sslmode=disable
      API_KEYS: ${API_KEYS:?falta API_KEYS en .env}
      PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # El ciclo de reposición le pregunta a proveedores-service quién es el
      # más barato. Va DIRECTO a una réplica por la red interna, no por el
      # gateway: el gateway es la puerta de los consumidores externos, y el
      # tráfico entre servicios propios no tiene que dar esa vuelta (ADR-005).
      PROVEEDORES_URL: http://proveedores-service-1:8080
      PROVEEDORES_API_KEY: ${PROVEEDORES_API_KEY:-${API_KEYS}}
      INTERVALO_REPOSICION: ${INTERVALO_REPOSICION:-1h}
      # Pedidos a FAV (ADR-009): salen directo a FAV, nunca por el gateway.
      # Sin FAV_URL en .env se usa el mock, igual que import-service.
      FAV_URL: ${FAV_URL:-http://fav-mock:8090}
      FAV_API_KEY: ${FAV_API_KEY}
      FAV_PROVEEDOR_ID: "11"
      # El receptor del webhook, tal como lo alcanza FAV. Con el mock es la
      # red interna; con el FAV desplegado tiene que ser una URL pública que
      # llegue a stock-service sin pasar por el gateway.
      FAV_SECRETO_AVISOS: ${FAV_SECRETO_AVISOS:-secreto-de-prueba}
      INTERVALO_PEDIDOS_FAV: ${INTERVALO_PEDIDOS_FAV:-15m}
    depends_on:
      postgres:
        condition: service_healthy
      # No es dependencia dura: si FAV no está, la orden espera en BORRADOR.
      fav-mock:
        condition: service_started
      # Sin la réplica sana el primer ciclo no tendría a quién preguntar. No es
      # fatal (la orden se crea sin proveedor y se reintenta), pero arrancar en
      # orden evita una primera vuelta inútil en cada `docker compose up`.
      proveedores-service-1:
        condition: service_healthy
    # La imagen es distroless: el healthcheck es el binario `sonda` de su
    # propia imagen, que pregunta por /readyz y sale 0 o 1.
    healthcheck:
      test: ["CMD", "/sonda"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [interna]
    restart: unless-stopped

  api-gateway:
    build:
      # El contexto es la raíz del repo: el módulo del gateway depende de
      # pkg/observabilidad por ruta relativa.
      context: .
      dockerfile: services/api-gateway/Dockerfile
    image: arq-soft/api-gateway:dev
    environment:
      PORT: "8080"
      UPSTREAMS_PROVEEDORES: http://proveedores-service-1:8080,http://proveedores-service-2:8080
      API_KEYS: ${API_KEYS:?falta API_KEYS en .env}
      TIMEOUT_UPSTREAM: ${TIMEOUT_UPSTREAM:-3s}
      INTERVALO_SALUD: ${INTERVALO_SALUD:-5s}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # stock-service, publicado en /api/v1/stock/ (sin balanceo: una sola
      # instancia).
      STOCK_URL: http://stock-service:8080
      # Login del frontend: usuarios de demo y secreto con el que se firman
      # los JWT. Sin alguno de los dos, no hay login y solo vale X-API-Key.
      USUARIOS: ${USUARIOS:-}
      JWT_SECRETO: ${JWT_SECRETO:-}
      DURACION_JWT: ${DURACION_JWT:-1h}
      # Límite de tráfico (token bucket, ADR-010): por API key o usuario, y
      # aparte por IP en el login. 0 lo apaga.
      LIMITE_POR_SEGUNDO: ${LIMITE_POR_SEGUNDO:-50}
      LIMITE_RAFAGA: ${LIMITE_RAFAGA:-100}
      LOGIN_POR_SEGUNDO: ${LOGIN_POR_SEGUNDO:-0.2}
      LOGIN_RAFAGA: ${LOGIN_RAFAGA:-5}
      # Las métricas salen por otro puerto, que no se publica: las lee
      # Prometheus por la red interna.
      PUERTO_METRICAS: "9091"
    ports:
      - "${PUERTO_GATEWAY:-8080}:8080"
    depends_on:
      proveedores-service-1:
        condition: service_healthy
      proveedores-service-2:
        condition: service_healthy
    # Jaeger no es una dependencia a propósito: si el colector no está, el
    # gateway tiene que seguir atendiendo igual, solo sin exportar trazas.
    healthcheck:
      test: ["CMD", "/sonda"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks: [interna]
    restart: unless-stopped

  # Métricas y alertas (ADR-011). Lee al gateway cada 5 s y evalúa las reglas
  # de infra/prometheus/alertas.yml: p95 > 300 ms, errores 5xx > 1 % y ninguna
  # réplica sana. Las alertas se ven en http://localhost:9090/alerts.
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alertas.yml:/etc/prometheus/alertas.yml:ro
      - datos-prometheus:/prometheus
    ports:
      - "${PUERTO_PROMETHEUS:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks: [interna]
    restart: unless-stopped

  # Tablero (ADR-011): tasa, errores, latencia, rechazos por límite y alertas
  # activas. El datasource y el tablero se cargan solos desde infra/grafana/.
  # Entrar en http://localhost:3000 (usuario admin, contraseña GRAFANA_PASSWORD).
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?falta GRAFANA_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/tableros/capacidad.json
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/tableros:/var/lib/grafana/tableros:ro
      - datos-grafana:/var/lib/grafana
    ports:
      - "${PUERTO_GRAFANA:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks: [interna]
    restart: unless-stopped

networks:
  interna:
    driver: bridge

volumes:
  datos-postgres:
  datos-rabbitmq:
  datos-mongodb:
  datos-meilisearch:
  datos-prometheus:
  datos-grafana:
