# Prometheus del TP (ADR-011). Lee las métricas del api-gateway, que es donde
# se ven la tasa, los errores y la latencia de la capacidad tal como los vive
# quien nos consume. El puerto de métricas (9091) no se publica al host.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:9091"]
