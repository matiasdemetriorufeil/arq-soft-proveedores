# Override para la VM en la nube (ADR-013, opción A). Se usa junto con el
# compose de siempre:
#
#   docker compose -f docker-compose.yml -f docker-compose.nube.yml up -d --build
#
# Lo único que cambia es qué sale a internet: solo el gateway (la capacidad,
# el login y el frontend). Las consolas de operación quedan atadas a
# 127.0.0.1 de la VM y se ven con un túnel SSH (ver docs/NUBE.md); el mock de
# FAV no se publica, así que nadie de afuera puede "apagarlo".
#
# `!override` reemplaza la lista de puertos en lugar de sumarla. Necesita
# Docker Compose 2.24.4 o más nuevo.
services:
  jaeger:
    ports: !override
      - "127.0.0.1:16686:16686"
    # Tope de memoria que pide ADR-013: sin él, Jaeger guarda todas las
    # trazas en memoria y llegó a 1,6 GB en una rampa de 4 minutos.
    environment:
      MEMORY_MAX_TRACES: "20000"
  rabbitmq:
    ports: !override
      - "127.0.0.1:15672:15672"
  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
  fav-mock:
    ports: !override
      - "127.0.0.1:8090:8090"
  # La única cosa, además del gateway, que tiene que salir a internet: el
  # receptor del webhook de FAV. ADR-009 pide que FAV llegue a stock-service
  # directo y no por el gateway, así que el servicio necesita su propio puerto
  # en la VM. Lo que queda expuesto:
  #
  #   POST /webhooks/fav       se autentica con la firma HMAC del aviso
  #   /api/v1/stock/...        detrás de conAPIKey, pero sin el límite de
  #                            tráfico del gateway: es la contra de abrir el
  #                            puerto, y está anotada en ARCHITECTURE.md
  #   /healthz, /readyz        sin datos
  #
  # A FAV se le pasa solo la URL del webhook (ver docs/contracts/para-fav.md).
  stock-service:
    ports:
      - "${PUERTO_WEBHOOK_FAV:-8081}:8080"
