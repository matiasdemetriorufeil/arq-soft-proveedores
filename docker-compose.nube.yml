# Override para la VM en la nube (ADR-013, opción A). Se usa junto con el
# compose de siempre:
#
#   docker compose -f docker-compose.yml -f docker-compose.nube.yml up -d --build
#
# Lo único que cambia es qué sale a internet: solo el gateway (la capacidad,
# el login y el frontend). Las consolas de operación quedan atadas a
# 127.0.0.1 de la VM y se ven con un túnel SSH (ver docs/NUBE.md); el mock de
# FAV no se publica, así que nadie de afuera puede "apagarlo".
#
# `!override` reemplaza la lista de puertos en lugar de sumarla. Necesita
# Docker Compose 2.24.4 o más nuevo.
services:
  jaeger:
    ports: !override
      - "127.0.0.1:16686:16686"
    # Tope de memoria que pide ADR-013: sin él, Jaeger guarda todas las
    # trazas en memoria y llegó a 1,6 GB en una rampa de 4 minutos.
    environment:
      MEMORY_MAX_TRACES: "20000"
  rabbitmq:
    ports: !override
      - "127.0.0.1:15672:15672"
  prometheus:
    ports: !override
      - "127.0.0.1:9090:9090"
  grafana:
    ports: !override
      - "127.0.0.1:3000:3000"
  fav-mock:
    ports: !override
      - "127.0.0.1:8090:8090"
  # El puerto del webhook de FAV quedó CERRADO a propósito (11/11).
  #
  # Se abrió el 10/11 para que FAV pudiera llegar a POST /webhooks/fav directo y
  # no por el gateway, como pide ADR-009. Al día siguiente FAV publicó su
  # contrato 1.2.0 y ahí el webhook no existe: no hay quien llame a esa ruta.
  #
  # Abrir el puerto también dejaba accesible /api/v1/stock/... por fuera del
  # gateway. Sigue detrás de su clave de API, pero SIN el límite de tráfico, así
  # que un puerto abierto sin consumidor es solo superficie de ataque. Se cierra.
  #
  # Para reabrirlo, si FAV alguna vez publica el webhook: descomentar las tres
  # líneas, abrir el puerto en el NSG y poner FAV_NOTIFICACION_URL en el .env.
  # La especificación de lo que verificamos está en docs/contracts/para-fav.md.
  #
  # stock-service:
  #   ports:
  #     - "${PUERTO_WEBHOOK_FAV:-8081}:8080"
